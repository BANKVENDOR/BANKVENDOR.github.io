<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANK VENDOR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffdd00 0%, #00a0e3 50%, #0055aa 100%);
      background-attachment: fixed;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .text-3d {
      font-size: clamp(3rem, 12vw, 9rem);
      font-weight: 900;
      color: #111;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.1;

      /* 3D black extruded effect */
      text-shadow:
        1px 1px 0 #000,
        2px 2px 0 #000,
        3px 3px 0 #000,
        4px 4px 0 #000,
        5px 5px 0 #000,
        6px 6px 0 #000,
        7px 7px 0 #000,
        8px 8px 0 #000,
        9px 9px 0 #000,
        10px 10px 0 #000,
        12px 12px 15px rgba(0, 0, 0, 0.45);
    }

    /* ===== Welcome Popup ===== */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .popup-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .popup {
      background: white;
      padding: 40px 50px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      max-width: 90%;
      transform: scale(1);
      transition: transform 0.3s ease;
    }

    .popup-overlay.hidden .popup {
      transform: scale(0.85);
    }

    .popup h2 {
      font-size: 2.4rem;
      font-weight: 900;
      color: #111;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .popup p {
      font-size: 1.1rem;
      color: #444;
      margin-bottom: 28px;
    }

    .popup button {
      background: linear-gradient(135deg, #00a0e3, #0055aa);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .popup button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 85, 170, 0.4);
    }
  </style>
</head>
<body>
  <h1 class="text-3d">BANK VENDOR</h1>

  <!-- Welcome Popup -->
  <div class="popup-overlay" id="welcomePopup">
    <div class="popup">
      <h2>Welcome</h2>
      <p>Glad you're here!</p>
      <button onclick="closePopup()">Continue</button>
    </div>
  </div>

  <script>
    function closePopup() {
      document.getElementById('welcomePopup').classList.add('hidden');
    }

    // Optional: also close when clicking outside the popup
    document.getElementById('welcomePopup').addEventListener('click', function(e) {
      if (e.target === this) {
        closePopup();
      }
    });
  </script>
</body>
</html>
