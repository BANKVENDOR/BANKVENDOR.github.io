
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANK VENDOR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffdd00 0%, #00a0e3 50%, #0055aa 100%);
      background-attachment: fixed;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .text-3d {
      font-size: clamp(3rem, 12vw, 9rem);
      font-weight: 900;
      color: #111;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.1;

      /* 3D black extruded effect */
      text-shadow:
        1px 1px 0 #000,
        2px 2px 0 #000,
        3px 3px 0 #000,
        4px 4px 0 #000,
        5px 5px 0 #000,
        6px 6px 0 #000,
        7px 7px 0 #000,
        8px 8px 0 #000,
        9px 9px 0 #000,
        10px 10px 0 #000,
        12px 12px 15px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <h1 class="text-3d">BANK VENDOR</h1>
</body>
</html>
